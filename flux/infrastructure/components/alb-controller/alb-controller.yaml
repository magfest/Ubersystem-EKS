---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: eks-charts
  namespace: kube-system
spec:
  interval: 12h
  url: https://aws.github.io/eks-charts
---
# The HelmRelease lives in its own Kustomization so that resources depending on
# the elbv2.k8s.aws CRDs it installs (see ../target-group-binding) can order
# themselves behind it with dependsOn. Substitutions are passed through from the
# parent Kustomization's postBuild.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alb-controller-helm
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/infrastructure/components/alb-controller/helmrelease
  prune: true
  sourceRef:
    kind: GitRepository
    name: ubersystem-eks
  postBuild:
    substitute:
      clustername: ${clustername}
      vpcId: ${vpcId}
      region: ${region}
