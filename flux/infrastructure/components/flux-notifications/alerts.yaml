---
# Loud channel — every Flux resource emitting an error-level event.
# Catches: reconciliation failures, GitRepository auth errors, health
# check failures (so a Deployment that doesn't become Ready within the
# Kustomization's health-check timeout pages here, which is how we catch
# "deployment timed out / excessive restarts" in practice — Flux waits
# for ReadyReplicas to match Replicas and reports failure on timeout).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-errors
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: OCIRepository
      name: '*'
    - kind: Bucket
      name: '*'
    - kind: HelmRepository
      name: '*'
    - kind: HelmChart
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
    - kind: ImageRepository
      name: '*'
    - kind: ImagePolicy
      name: '*'
    - kind: ImageUpdateAutomation
      name: '*'

---
# Quieter channel — successful image-driven deploys. Fires when
# ImageUpdateAutomation pushes a commit, when the resulting Kustomization
# applies its changes successfully, and when the underlying workload
# becomes healthy. Anything outside the image-bump path (config-only
# commits, hand-merged PRs) is filtered out by the inclusion patterns.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-image-deploys
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity: info
  inclusionList:
    - "pushed.*update"      # image-automation commit messages
    - "succeeded"           # reconciliation success summaries
    - "ready"               # workload-healthy events
  eventSources:
    - kind: ImageUpdateAutomation
      name: '*'
    - kind: Kustomization
      name: '*'
