---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: ingress-nginx
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 12h
  values:
    controller:
      replicaCount: 3
      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"
        proxy-real-ip-cidr: "${ingress_real_ip_cidr:=0.0.0.0/0}"
        location-snippet: |
          access_by_lua_block {
            ngx.var.pass_access_scheme = "https"
            ngx.var.pass_port = 443
          }
      service:
        type: ClusterIP
        enableHttps: false
        targetPorts:
          http: http
      admissionWebhooks:
        enabled: false
