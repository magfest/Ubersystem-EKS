---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ${eventname}
  annotations:
    dashy.io/title: ${dashy_title}
    dashy.io/url: https://${hostname}
    dashy.io/icon: generative
    dashy.io/group: Uber Prod
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: web
  selector:
    app: web
